project:
  type: website
  output-dir: docs

# English profile (_quarto-en.yml) is used when rendering without a profile,
# e.g. a plain `quarto preview`. babelquarto passes the profile explicitly.
profile:
  default: en

website:
  title: "Hydro Biogeo Lab"
  description: ""
  site-url: https://audreycampeau.github.io/hydro-biogeo-lab
  favicon: images/HydrobioGeo_Logo_flavicon.png
  
  navbar:
    logo: images/HydrobioGeo_Logo_flavicon.png
    background: "#1a4d6e"  # Deep ocean
    foreground: "#f5f5f0"  # Off-white
    # The menu items (left) live in _quarto-en.yml and _quarto-fr.yml:
    # Quarto concatenates lists from profiles, so they can't be shared here.
    # The right side holds only babelquarto's English/Français switcher,
    # moved there by babelquarto-switcher.html (see format > html > include-after-body).



  page-footer:
    border: true
    background: light
    left: |
      © 2026 Hydro Biogeo Lab at Université de Montréal. All rights reserved.
    center: |
      This website was built with [Quarto](https://quarto.org)
        

format:
  html:
    theme: 
      - flatly
      - hydro.scss
    toc: true
    toc-depth: 3
    toc-location: right
    page-layout: article
    grid:
      body-width: 900px
      sidebar-width: 250px
      margin-width: 250px
    fontsize: 1.1rem
    linestretch: 1.8
    mainfont: "Atkinson Hyperlegible"
    monofont: "Source Code Pro"
    code-copy: true
    code-overflow: wrap
    link-external-icon: false
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: true
    include-after-body: babelquarto-switcher.html
    

    citations-hover: true
    footnotes-hover: true
    
    # Syntax highlighting
    highlight-style: github
    
    # Additional metadata
    # (lang is now set at the top level, below, so the French profile can override it)
    date-format: "MMMM D, YYYY"
    


# Execute settings for code chunks
execute:
  freeze: auto
  echo: false
  warning: false
  message: false

# Editor settings
editor: visual

# ---- Bilingual setup (babelquarto) ----
babelquarto:
  languagelinks: navbar
  languagecodes:
  - name: fr
    text: "Français"
  - name: en
    text: "English"
  mainlanguage: 'en'
  languages: ['fr']
title-fr: "Hydro Biogeo Lab"
description-fr: ""
lang: en
