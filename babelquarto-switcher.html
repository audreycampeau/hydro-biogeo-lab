<!-- English/Français switcher on the right-hand side of the navbar.
     babelquarto only adds its own switcher when the site is built with
     babelquarto::render_website(), and its links point to the live site.
     This script builds the switcher on every page instead (so it also shows with
     RStudio's Render button / quarto preview), with links relative to the current
     page: English pages live at <site>/..., French pages at <site>/fr/... -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var collapse = document.getElementById("navbarCollapse");
  if (!collapse) return;

  // Drop babelquarto's switcher (left side, absolute links); ours replaces it.
  var old = document.getElementById("languages-links-parent");
  if (old) (old.closest("li.nav-item") || old).remove();

  // Quarto gives every page its offset to the root of the (English or French) site.
  var offsetMeta = document.querySelector('meta[name="quarto:offset"]');
  var root = new URL(offsetMeta ? offsetMeta.content : "./", window.location.href).href;
  var page = window.location.href.slice(root.length) || "index.html";
  var isFrench = (document.documentElement.lang || "").slice(0, 2) === "fr";

  var current = isFrench ? "Français" : "English";
  var other = isFrench ? "English" : "Français";
  var otherHref = new URL((isFrench ? "../" : "fr/") + page, root).href;

  var right = collapse.querySelector("ul.navbar-nav.ms-auto");
  if (!right) {
    right = document.createElement("ul");
    right.className = "navbar-nav navbar-nav-scroll ms-auto";
    collapse.appendChild(right);
  }
  var item = document.createElement("li");
  item.className = "nav-item dropdown";
  item.id = "languages-links-parent";
  item.innerHTML =
    '<button class="btn dropdown-toggle babelquarto-languages-button" type="button" ' +
    'data-bs-toggle="dropdown" aria-expanded="false" aria-label="Language / Langue">' +
    '<i class="bi bi-globe2"></i> ' + current + "</button>" +
    '<ul class="dropdown-menu dropdown-menu-end">' +
    '<li><a class="dropdown-item" lang="' + (isFrench ? "en" : "fr") + '" href="' +
    otherHref + '">' + other + "</a></li></ul>";
  right.appendChild(item);
});
</script>
<style>
#languages-links-parent .babelquarto-languages-button {
  background: transparent;
  border: 1px solid rgba(245, 245, 240, 0.6);
  color: #f5f5f0;
  margin-left: 0.5rem;
}
</style>
